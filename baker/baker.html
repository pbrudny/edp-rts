<!doctype html>
<meta charset="utf-8">
<title>Ember Realms sprite baker</title>
<body style="margin:0;background:#333;color:#eee;font:12px monospace">
<div id="log">baking…</div>
<script type="module">
import * as THREE from "./vendor/three.module.js";
import * as M from "./models.js";

const SCALE = 2;                       // bake at 2x for crisp zoom
const P = SCALE * 64 / Math.SQRT2;     // pixels per world unit (64 px wide tile diamond at 1x)
const EL = Math.PI / 6;                // 30 deg elevation = 2:1 isometric
const log = (t) => (document.getElementById("log").textContent += "\n" + t);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
const scene = new THREE.Scene();
const hemi = new THREE.HemisphereLight(0xeef3ff, 0x7a6a50, 1.5); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.6); sun.position.set(-1.5, 7, 4.5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 20 }); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
scene.add(sun); scene.add(sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.ShadowMaterial({ opacity: 0.38 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 50);
const dist = 20; camera.position.set(Math.cos(EL) * dist / Math.SQRT2, Math.sin(EL) * dist, Math.cos(EL) * dist / Math.SQRT2); camera.lookAt(0, 0, 0);
const MAGENTA = new THREE.MeshBasicMaterial({ color: 0xff00ff }), WHITE = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.85, flatShading: true });

// render one object into a W x H canvas with the world origin at pixel (ax, ay); returns cropped {base, mask, ax, ay}
function shoot(obj, W, H, ax, ay) {
  renderer.setSize(W, H, false);
  Object.assign(camera, { left: -ax / P, right: (W - ax) / P, top: ay / P, bottom: -(H - ay) / P }); camera.updateProjectionMatrix();
  scene.add(obj);
  renderer.setClearColor(0x000000, 0); renderer.render(scene, camera);
  const base = grab(W, H);
  // mask pass: team parts lit white, everything else magenta (keyed out), no ground shadow
  const saved = [];
  obj.traverse((o) => { if (o.isMesh) { saved.push([o, o.material]); o.material = o.userData.team ? WHITE : MAGENTA; } });
  ground.visible = false; renderer.setClearColor(0xff00ff, 1); renderer.render(scene, camera);
  const mask = grab(W, H);
  for (const [o, m] of saved) o.material = m;
  ground.visible = true; scene.remove(obj);
  const md = mask.getContext("2d").getImageData(0, 0, W, H), d = md.data;
  let hasTeam = false;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i + 1], b = d[i + 2];
    const magenta = Math.min(r, b) - g; // ~255 for pure magenta, ~0 for grey
    if (magenta > 60) { d[i + 3] = 0; continue; }
    const lum = (r + g + b) / 3; d[i] = d[i + 1] = d[i + 2] = Math.min(255, lum * 1.1); d[i + 3] = 255; hasTeam = true;
  }
  mask.getContext("2d").putImageData(md, 0, 0);
  // crop to the base alpha bounding box
  const bd = base.getContext("2d").getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (bd[(y * W + x) * 4 + 3] > 6) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) { x0 = y0 = 0; x1 = y1 = 1; }
  x0 = Math.max(0, x0 - 1); y0 = Math.max(0, y0 - 1); x1 = Math.min(W - 1, x1 + 1); y1 = Math.min(H - 1, y1 + 1);
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  const crop = (src) => { const c = document.createElement("canvas"); c.width = cw; c.height = ch; c.getContext("2d").drawImage(src, x0, y0, cw, ch, 0, 0, cw, ch); return c; };
  return { base: crop(base), mask: hasTeam ? crop(mask) : null, w: cw, h: ch, ax: ax - x0, ay: ay - y0 };
}
function grab(W, H) { const c = document.createElement("canvas"); c.width = W; c.height = H; c.getContext("2d").drawImage(renderer.domElement, 0, 0); return c; }

// shelf packer into pages of max 2048 x 2048
function pack(frames, maxW = 2048, maxH = 2048) {
  const list = Object.entries(frames).sort((a, b) => b[1].h - a[1].h);
  const pages = []; let page = null, x = 0, y = 0, rowH = 0;
  const newPage = () => { page = { frames: {}, w: 0, h: 0 }; pages.push(page); x = 0; y = 0; rowH = 0; };
  newPage();
  for (const [name, f] of list) {
    if (x + f.w + 2 > maxW) { x = 0; y += rowH + 2; rowH = 0; }
    if (y + f.h + 2 > maxH) newPage();
    f.x = x; f.y = y; page.frames[name] = f; x += f.w + 2; rowH = Math.max(rowH, f.h); page.w = Math.max(page.w, x); page.h = Math.max(page.h, y + rowH);
  }
  return pages;
}
async function save(name, frames) {
  const pages = pack(frames), meta = { scale: SCALE, pages: [] };
  for (let p = 0; p < pages.length; p++) {
    const pg = pages[p], W = Math.ceil(pg.w / 4) * 4, H = Math.ceil(pg.h / 4) * 4;
    const base = document.createElement("canvas"); base.width = W; base.height = H;
    const mask = document.createElement("canvas"); mask.width = W; mask.height = H;
    const out = {};
    for (const [n, f] of Object.entries(pg.frames)) {
      base.getContext("2d").drawImage(f.base, f.x, f.y);
      if (f.mask) mask.getContext("2d").drawImage(f.mask, f.x, f.y);
      out[n] = [f.x, f.y, f.w, f.h, f.ax, f.ay, f.mask ? 1 : 0];
    }
    await post(`${name}_${p}.png`, base.toDataURL("image/png"));
    await post(`${name}_${p}_mask.png`, mask.toDataURL("image/png"));
    meta.pages.push({ image: `${name}_${p}.png`, mask: `${name}_${p}_mask.png`, w: W, h: H, frames: out });
    log(`${name} page ${p}: ${W}x${H}, ${Object.keys(out).length} frames`);
  }
  await post(`${name}.json`, JSON.stringify(meta));
}
const post = (name, body) => fetch(`/save/${name}`, { method: "POST", body });

// ------------------------------------------------------------------ jobs
const UNITS = { villager: ["idle", "walk", "attack", "work", "death"], swordsman: ["idle", "walk", "attack", "death"], archer: ["idle", "walk", "attack", "death"], spearman: ["idle", "walk", "attack", "death"], cavalry: ["idle", "walk", "attack", "death"], knight: ["idle", "walk", "attack", "death"], crossbowman: ["idle", "walk", "attack", "death"], ram: ["idle", "walk", "attack", "death"] };
const FRAMES = { idle: 1, walk: 8, attack: 6, work: 6, death: 6 };
const unitFrames = {};
for (const [kind, anims] of Object.entries(UNITS)) {
  const h = M.makeUnit(kind);
  for (const anim of anims) for (let d = 0; d < 8; d++) for (let i = 0; i < FRAMES[anim]; i++) {
    M.pose(kind, h, anim, i / FRAMES[anim]);
    h.root.rotation.y = -(d * Math.PI) / 4;
    h.root.updateMatrixWorld(true);
    unitFrames[`${kind}_${anim}_${d}_${i}`] = shoot(h.root, 220, 220, 110, 150);
  }
  log(`${kind} done`);
}
await save("units", unitFrames);

const objFrames = {};
for (const [kind, w] of [["house", 2], ["tc", 3], ["barracks", 3], ["storehouse", 2], ["farm", 2], ["workshop", 3], ["market", 3]]) {
  const o = M.makeBuilding(kind); objFrames[kind] = shoot(o, 520, 560, 260, 400);
}
objFrames.tower = shoot(M.makeBuilding("tower"), 400, 640, 200, 500);
for (const kind of ["wall", "gate"]) objFrames[kind] = shoot(M.makeBuilding(kind), 240, 300, 120, 200);
objFrames.found1 = shoot(M.makeFoundation(1, 1), 240, 260, 120, 180);
objFrames.found2 = shoot(M.makeFoundation(2, 2), 400, 360, 200, 240);
objFrames.found3 = shoot(M.makeFoundation(3, 3), 520, 440, 260, 300);
for (let v = 0; v < 8; v++) objFrames[`tree${v}`] = shoot(M.makeTree(v), 220, 260, 110, 210);
objFrames.stump = shoot(M.makeStump(), 80, 80, 40, 50);
for (let v = 0; v < 3; v++) objFrames[`gold${v}`] = shoot(M.makeGold(v), 360, 300, 180, 200);
for (let v = 0; v < 3; v++) objFrames[`berries${v}`] = shoot(M.makeBerries(v), 160, 160, 80, 100);
await save("objects", objFrames);
log("ALL DONE");
document.title = "baked";
</script>
</body>
