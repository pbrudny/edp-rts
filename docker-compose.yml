name: edp-rts
services:
  rts:
    build: .
    container_name: edp-rts
    restart: unless-stopped
    environment:
      BROKER_URL: http://edp-redpanda:8082
      BROKER_USER: demo
      BROKER_PASSWORD: ${EDP_BROKER_DEMO_PASSWORD}
      TOPIC: demo.rts
      # GitHub login (required to play when set): OAuth app callback https://rts.atabuilderslab.pl/auth/callback
      GITHUB_CLIENT_ID: ${RTS_GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${RTS_GITHUB_CLIENT_SECRET}
      SESSION_SECRET: ${RTS_SESSION_SECRET}
      PUBLIC_URL: https://rts.atabuilderslab.pl
    volumes: [rts-data:/data]
    networks: [coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.edp-rts.rule=Host(`rts.atabuilderslab.pl`) || Host(`rts.codewithpeter.com`)
      - traefik.http.routers.edp-rts.entrypoints=http
      - traefik.http.services.edp-rts.loadbalancer.server.port=3000
volumes:
  rts-data:
networks:
  coolify:
    external: true
